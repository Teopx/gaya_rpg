name: Validate web and Cloudflare backend
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Cloudflare after tests and production approval'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: web-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/configure-cloud.mjs
        env:
          DATABASE_ID: 00000000-0000-0000-0000-000000000000
          KV_NAMESPACE_ID: '00000000000000000000000000000000'
          APP_ORIGIN: https://validation.invalid
      - run: npx wrangler deploy --dry-run --config wrangler.deploy.toml --outdir build/worker
      - uses: actions/upload-artifact@v4
        with:
          name: nacoes-hibridas-web
          path: |
            dist/
            build/worker/
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.4.1'
          use-dotnet: false
          include-templates: true
      - name: Install matching GUT
        run: |
          git clone --depth 1 --branch v9.4.0 https://github.com/bitwes/Gut.git /tmp/gut
          mkdir -p godot/addons
          cp -R /tmp/gut/addons/gut godot/addons/gut
      - run: godot --headless --path godot --editor --import
      - run: godot --headless --path godot -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit
      - run: mkdir -p dist/godot
      - run: godot --headless --path godot --export-release Web ../dist/godot/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: godot-web
          path: dist/godot/
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [test, godot]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: ${{ vars.DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: godot-web
          path: dist/godot/
      - run: node scripts/configure-cloud.mjs
      - run: node scripts/seed.mjs
      - run: npx --no-install wrangler deploy --dry-run --config wrangler.deploy.toml
      - run: npx --no-install wrangler d1 migrations apply nacoes-hibridas --remote --config wrangler.deploy.toml
      - run: npx --no-install wrangler d1 execute nacoes-hibridas --remote --file build/seed.sql --config wrangler.deploy.toml
      - run: npx --no-install wrangler deploy --config wrangler.deploy.toml
      - name: Check published health
        run: curl --fail --retry 3 --retry-delay 5 "$APP_ORIGIN/api/health"
